name: Keep Streamlit app awake

on:
  schedule:
    # Every 4 hours, at minute 23 (off the hour, so GitHub is less likely to delay it).
    # Streamlit sleeps apps after ~12 hours without traffic, so this leaves plenty of margin.
    - cron: "23 */4 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app (and wake it if needed)
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python scripts/keep_awake.py
